<sc-if value="{{ live.secSizes }}" hint-placeholder-val="{{ false }}">
  <div style="padding:14px 16px;background:var(--accentSoft);border:1px solid var(--accentBrd);border-radius:14px;margin-bottom:18px;color:var(--accentInk);font-size:13.5px;font-weight:700;line-height:1.45;">{{ live.sizes.note }}</div>
  <div style="display:flex;flex-direction:column;gap:12px;">
    <sc-for list="{{ live.sizes.rows }}" as="z" hint-placeholder-count="5">
      <div style="background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <input value="{{ z.label }}" sc-camel-on-input="{{ z.setLabel }}" sc-camel-on-key-down="{{ z.onKey }}" placeholder="Name" style="flex:1;min-width:160px;height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;">
          <button sc-camel-on-click="{{ z.up }}" title="Move up" style="width:40px;height:44px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--ink2);">↑</button>
          <button sc-camel-on-click="{{ z.down }}" title="Move down" style="width:40px;height:44px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--ink2);">↓</button>
          <button sc-camel-on-click="{{ z.toggle }}" title="On or off" style="{{ z.track }}"><span style="{{ z.knob }}"></span></button>
          <button sc-camel-on-click="{{ z.remove }}" title="Remove" style="width:40px;height:44px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:#C2410C;">✕</button>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;">
          <span style="flex:1;min-width:180px;font-size:12px;font-weight:600;color:var(--ink3);">{{ z.keyLine }}</span>
          <sc-if value="{{ z.dirty }}" hint-placeholder-val="{{ false }}"><button sc-camel-on-click="{{ z.discard }}" style="height:40px;padding:0 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:12.5px;">Discard</button><button sc-camel-on-click="{{ z.save }}" style="{{ z.saveStyle }}">{{ z.saveLabel }}</button></sc-if>
        </div>
        <sc-if value="{{ z.hasError }}" hint-placeholder-val="{{ false }}"><div style="margin-top:8px;font-size:12.5px;font-weight:700;color:#C2410C;">{{ z.error }}</div></sc-if>
      </div>
    </sc-for>
    <sc-if value="{{ live.sizes.add.open }}" hint-placeholder-val="{{ false }}">
      <div style="background:var(--panel2);border:1.5px dashed var(--line);border-radius:16px;padding:14px 16px;">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <input value="{{ live.sizes.add.label }}" sc-camel-on-input="{{ live.sizes.add.setLabel }}" sc-camel-on-key-down="{{ live.sizes.add.onKey }}" placeholder="New size name" style="flex:1;min-width:160px;height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;">
          <button sc-camel-on-click="{{ live.sizes.add.cancel }}" style="height:44px;padding:0 16px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13px;">Cancel</button>
          <button sc-camel-on-click="{{ live.sizes.add.save }}" style="height:44px;padding:0 18px;border-radius:11px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;">{{ live.sizes.add.saveLabel }}</button>
        </div>
        <div style="margin-top:10px;font-size:12px;font-weight:600;color:var(--ink3);">{{ live.sizes.add.keyLine }}</div>
        <sc-if value="{{ live.sizes.add.hasError }}" hint-placeholder-val="{{ false }}"><div style="margin-top:8px;font-size:12.5px;font-weight:700;color:#C2410C;">{{ live.sizes.add.error }}</div></sc-if>
      </div>
    </sc-if>
    <sc-if value="{{ live.sizes.add.canAdd }}" hint-placeholder-val="{{ true }}">
      <div><button sc-camel-on-click="{{ live.sizes.add.start }}" style="height:46px;padding:0 18px;border-radius:12px;background:var(--panel);border:1.5px dashed var(--line);font-weight:800;font-size:13.5px;color:var(--ink2);">+ Add size</button></div>
    </sc-if>
  </div>
</sc-if>
