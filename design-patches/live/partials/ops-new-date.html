<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:6px 6px 6px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;">
  <span style="font-size:13px;font-weight:700;">{{= nf.dateLabel }}</span>
  <div style="display:flex;gap:6px;">
    <button sc-camel-on-click="{{ nf.prevDate }}" title="Previous day" style="width:34px;height:34px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:16px;font-weight:800;color:var(--ink2);">‹</button>
    <button sc-camel-on-click="{{ nf.nextDate }}" title="Next day" style="width:34px;height:34px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:16px;font-weight:800;color:var(--ink2);">›</button>
  </div>
</div>
