<sc-if value="{{ live.asst.dirty }}" hint-placeholder-val="{{ false }}">
  <div style="flex:none;display:flex;align-items:center;gap:12px;padding:14px 26px;border-top:1px solid var(--line);background:var(--panel2);">
    <div style="{{ live.asst.saveTitleStyle }}">{{ live.asst.saveTitle }}</div>
    <button sc-camel-on-click="{{ live.asst.discard }}" style="height:46px;padding:0 18px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;">Discard</button>
    <button sc-camel-on-click="{{ live.asst.save }}" style="{{ live.asst.saveStyle }}">{{ live.asst.saveLabel }}</button>
  </div>
</sc-if>
