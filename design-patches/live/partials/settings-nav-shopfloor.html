<sc-if value="{{ live.shopFloor }}" hint-placeholder-val="{{ false }}">
  <div style="font-size:11px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:0.07em;padding:16px 12px 8px;">Shop floor</div>
  <sc-if value="{{ live.canKiosk }}" hint-placeholder-val="{{ false }}"><button sc-camel-on-click="{{ live.goKiosk }}" style="{{ live.xnav.kiosk }}"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2.5" stroke="currentColor" stroke-width="2"></rect><path d="M10 17.5h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg><span style="flex:1;text-align:left;">Kiosk</span></button></sc-if>
  <sc-if value="{{ live.canActivity }}" hint-placeholder-val="{{ false }}"><button sc-camel-on-click="{{ live.goActivity }}" style="{{ live.xnav.activity }}"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg><span style="flex:1;text-align:left;">Team activity</span></button></sc-if>
</sc-if>
