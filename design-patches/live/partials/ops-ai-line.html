<sc-if value="{{ sel.aiLineShow }}" hint-placeholder-val="{{ false }}">
  <div style="flex:none;display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 13px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;">
    <span style="flex:none;width:8px;height:8px;border-radius:50%;background:#7A3B8A;"></span>
    <div style="min-width:0;line-height:1.35;"><div style="font-size:12.5px;font-weight:800;color:var(--ink);">{{= sel.aiLineText }}</div><div style="font-size:11.5px;font-weight:600;color:var(--ink3);">{{= sel.aiLineSub }}</div></div>
  </div>
</sc-if>
