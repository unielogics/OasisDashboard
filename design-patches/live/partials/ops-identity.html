<sc-if value="{{ sel.idShow }}" hint-placeholder-val="{{ false }}">
  <div style="grid-column:1/3;display:flex;align-items:flex-end;gap:12px;">
    <div style="flex:1;min-width:0;"><div style="font-size:11.5px;color:var(--ink3);font-weight:700;">Website PIN</div><div style="font-size:14px;font-weight:700;margin-top:2px;">{{ sel.idValue }}</div></div>
    <sc-if value="{{ sel.idCanClear }}" hint-placeholder-val="{{ false }}"><button sc-camel-on-click="{{ sel.idClear }}" style="flex:none;height:36px;padding:0 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--ink2);">Clear PIN</button></sc-if>
  </div>
  <sc-if value="{{ sel.idConfirming }}" hint-placeholder-val="{{ false }}">
    <div style="{{ sel.idConfirmStyle }}">
      <div style="font-size:13px;font-weight:700;color:#C2410C;line-height:1.45;">{{ sel.idConfirmText }}</div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button sc-camel-on-click="{{ sel.idConfirm }}" style="{{ sel.idConfirmBtnStyle }}">Clear PIN</button>
        <button sc-camel-on-click="{{ sel.idCancel }}" style="height:38px;padding:0 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:12.5px;color:var(--ink2);">Keep it</button>
      </div>
    </div>
  </sc-if>
</sc-if>
