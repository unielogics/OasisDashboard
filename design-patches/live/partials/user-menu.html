<sc-if value="{{ live.menu.open }}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;right:0;top:52px;z-index:50;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadowLg);padding:6px;">
    <div style="padding:9px 10px 8px;">
      <div style="font-weight:800;font-size:13.5px;">{{= live.user.name }}</div>
      <div style="font-size:11.5px;font-weight:600;color:var(--ink3);margin-top:1px;">{{= live.user.email }}</div>
    </div>
    <div style="border-top:1px solid var(--line);margin:4px 6px;"></div>
    <sc-if value="{{ live.menu.canKiosk }}" hint-placeholder-val="{{ false }}">
      <button sc-camel-on-click="{{ live.menu.openKiosk }}" style="display:flex;align-items:center;width:100%;padding:9px 10px;border-radius:10px;font-weight:700;font-size:13.5px;">Kiosk…</button>
    </sc-if>
    <sc-if value="{{ live.menu.canTeamActivity }}" hint-placeholder-val="{{ false }}">
      <button sc-camel-on-click="{{ live.menu.teamActivity }}" style="display:flex;align-items:center;width:100%;padding:9px 10px;border-radius:10px;font-weight:700;font-size:13.5px;">Team activity…</button>
    </sc-if>
    <sc-if value="{{ live.menu.isKiosk }}" hint-placeholder-val="{{ false }}">
      <button sc-camel-on-click="{{ live.menu.managerSignIn }}" style="display:flex;align-items:center;width:100%;padding:9px 10px;border-radius:10px;font-weight:700;font-size:13.5px;">Manager sign-in</button>
    </sc-if>
    <sc-if value="{{ live.menu.confirming }}" hint-placeholder-val="{{ false }}">
      <div style="padding:9px 10px 4px;font-size:12.5px;font-weight:700;color:var(--ink2);line-height:1.45;">Lock the kiosk now? A PIN opens it again.</div>
      <div style="display:flex;gap:6px;padding:4px 4px 2px;">
        <button sc-camel-on-click="{{ live.menu.confirmLock }}" style="flex:1;height:38px;border-radius:10px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;">Lock</button>
        <button sc-camel-on-click="{{ live.menu.cancelLock }}" style="flex:1;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--ink);">Cancel</button>
      </div>
    </sc-if>
    <sc-if value="{{ live.menu.showSignOut }}" hint-placeholder-val="{{ false }}">
      <button sc-camel-on-click="{{ live.menu.signOut }}" style="display:flex;align-items:center;width:100%;padding:9px 10px;border-radius:10px;font-weight:800;font-size:13.5px;">{{= live.menu.signOutLabel }}</button>
    </sc-if>
  </div>
</sc-if>
