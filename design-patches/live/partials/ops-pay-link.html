<sc-if value="{{ sel.payLinkOpen }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;flex-direction:column;gap:8px;">
    <sc-if value="{{ sel.payLinkNeedsUrl }}" hint-placeholder-val="{{ true }}"><input value="{{ sel.payLinkUrl }}" sc-camel-on-input="{{ sel.setLinkUrl }}" placeholder="Squarespace invoice or checkout URL" autocomplete="off" style="{{ nf.inputStyle }}"></sc-if>
    <sc-if value="{{ sel.payLinkSquare }}" hint-placeholder-val="{{ false }}"><div style="font-size:12.5px;font-weight:600;color:var(--ink2);">{{ sel.payLinkText }}</div></sc-if>
    <sc-if value="{{ sel.hasPayLinkError }}" hint-placeholder-val="{{ false }}"><div style="color:#C2410C;font-size:12.5px;font-weight:700;">{{= sel.payLinkError }}</div></sc-if>
    <button sc-camel-on-click="{{ sel.submitLink }}" style="height:48px;background:var(--accentSoft);border:1px solid var(--accentBrd);border-radius:13px;font-weight:800;font-size:14px;color:var(--accentInk);">Send link by SMS</button>
  </div>
</sc-if>
