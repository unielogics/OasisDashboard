<sc-if value="{{ nf.hasHits }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px;">
    <div style="font-size:11px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:0.06em;">Existing customers</div>
    <sc-for list="{{ nf.hits }}" as="ht" hint-placeholder-count="3">
      <button sc-camel-on-click="{{ ht.pick }}" style="{{ ht.style }}">
        <div style="text-align:left;"><div style="font-weight:700;font-size:13.5px;">{{ ht.name }}</div><div style="font-size:12px;color:var(--ink2);font-weight:600;margin-top:1px;">{{ ht.sub }}</div></div>
        <sc-if value="{{ ht.vip }}" hint-placeholder-val="{{ false }}"><span style="font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:#7A3B8A;color:#fff;">VIP</span></sc-if>
      </button>
    </sc-for>
  </div>
</sc-if>
