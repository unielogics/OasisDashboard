<sc-if value="{{ live.feeShow }}" hint-placeholder-val="{{ false }}">
  <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">
    <sc-for list="{{ live.feeRows }}" as="fr" hint-placeholder-count="1">
      <div style="padding:11px 13px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;">
        <div style="font-size:13px;font-weight:800;">{{ fr.title }}</div>
        <div style="{{ fr.lineStyle }}">{{ fr.line }}</div>
        <sc-if value="{{ fr.canDecide }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:6px;margin-top:8px;"><button sc-camel-on-click="{{ fr.charge }}" style="{{ live.feeButtonStyle }}">{{ fr.chargeLabel }}</button><button sc-camel-on-click="{{ fr.waive }}" style="height:32px;padding:0 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--ink2);">Waive</button></div>
        </sc-if>
        <sc-if value="{{ fr.confirming }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:8px;font-size:12.5px;font-weight:700;color:var(--accentInk);line-height:1.45;">{{ fr.confirmText }}</div>
          <div style="display:flex;gap:6px;margin-top:8px;"><button sc-camel-on-click="{{ fr.confirm }}" style="{{ live.feeConfirmBtnStyle }}">{{ fr.chargeLabel }}</button><button sc-camel-on-click="{{ fr.back }}" style="height:32px;padding:0 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--ink2);">Back</button></div>
        </sc-if>
        <sc-if value="{{ fr.waiving }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:8px;font-size:12.5px;font-weight:700;color:var(--accentInk);">Waive the fee? Nothing is charged. Say why:</div>
          <input value="{{ fr.reason }}" sc-camel-on-input="{{ fr.setReason }}" placeholder="Why is it waived?" autocomplete="off" style="width:100%;height:38px;margin-top:6px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:600;">
          <div style="display:flex;gap:6px;margin-top:8px;"><button sc-camel-on-click="{{ fr.waiveConfirm }}" style="{{ live.feeConfirmBtnStyle }}">Waive fee</button><button sc-camel-on-click="{{ fr.back }}" style="height:32px;padding:0 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--ink2);">Back</button></div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</sc-if>
