<sc-if value="{{ live.hasCatSplit }}" hint-placeholder-val="{{ false }}">
  <div style="flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 26px 0;">
    <span style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:0.05em;margin-right:2px;">{{ live.catSplitLabel }}</span>
    <sc-for list="{{ live.catSplit }}" as="c" hint-placeholder-count="5">
      <span style="{{ c.style }}"><span style="{{ c.swatch }}"></span><span style="font-size:12.5px;font-weight:700;color:var(--ink2);">{{ c.label }}</span><span style="font-size:13px;font-weight:800;">{{ c.value }}</span><span style="font-size:11.5px;font-weight:600;color:var(--ink3);">{{ c.sub }}</span></span>
    </sc-for>
  </div>
</sc-if>
