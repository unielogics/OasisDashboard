<sc-if value="{{ live.hasCatCounts }}" hint-placeholder-val="{{ false }}">
  <div style="grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <span style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:0.05em;margin-right:2px;">{{ live.catCountsLabel }}</span>
    <sc-for list="{{ live.catCounts }}" as="c" hint-placeholder-count="5">
      <span style="display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;background:var(--panel);border:1px solid var(--line);border-radius:9px;font-size:12px;font-weight:700;color:var(--ink2);"><span style="{{ c.swatch }}"></span>{{ c.label }}<span style="font-weight:800;color:var(--ink);">{{ c.count }}</span></span>
    </sc-for>
  </div>
</sc-if>
