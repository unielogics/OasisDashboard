<sc-if value="{{ live.hasCatCounts }}" hint-placeholder-val="{{ false }}">
  <div style="grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <span style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:0.05em;margin-right:2px;">{{ live.catCountsLabel }}</span>
    <sc-for list="{{ live.catCounts }}" as="c" hint-placeholder-count="6">
      <button sc-camel-on-click="{{ c.onClick }}" title="{{ c.title }}" style="{{ c.style }}"><span style="{{ c.swatch }}"></span>{{ c.label }}<span style="font-weight:800;color:var(--ink);">{{ c.count }}</span></button>
    </sc-for>
  </div>
</sc-if>
