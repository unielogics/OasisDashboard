<sc-if value="{{ sel.hhShow }}" hint-placeholder-val="{{ false }}">
  <div style="margin-top:16px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:10px;">
    <sc-if value="{{ sel.hasPlanSize }}" hint-placeholder-val="{{ false }}"><div><div style="font-size:11.5px;color:var(--ink3);font-weight:700;">Plan size</div><div style="font-size:14px;font-weight:700;margin-top:2px;">{{ sel.hhPlanSize }}</div></div></sc-if>
    <div>
      <div style="font-size:11.5px;color:var(--ink3);font-weight:700;">Household</div>
      <sc-if value="{{ sel.hhShared }}" hint-placeholder-val="{{ false }}"><div style="font-size:14px;font-weight:700;margin-top:2px;">{{ sel.hhSharedText }}</div></sc-if>
      <sc-if value="{{ sel.hhEmpty }}" hint-placeholder-val="{{ false }}"><div style="font-size:13px;font-weight:600;color:var(--ink2);margin-top:2px;">Only the holder. Add family members to share it.</div></sc-if>
      <sc-for list="{{ sel.hhMembers }}" as="hm" hint-placeholder-count="1">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;"><span style="font-size:14px;font-weight:700;">{{ hm.name }}</span><button sc-camel-on-click="{{ hm.remove }}" style="height:32px;padding:0 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--ink2);">Remove</button></div>
      </sc-for>
    </div>
    <sc-if value="{{ sel.hhCanAdd }}" hint-placeholder-val="{{ false }}">
      <input value="{{ sel.hhQuery }}" sc-camel-on-input="{{ sel.setHhQuery }}" placeholder="Add a family member: name or phone" autocomplete="off" style="{{ sel.hhInputStyle }}">
      <sc-if value="{{ sel.hhHasHits }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:6px;">
          <sc-for list="{{ sel.hhHits }}" as="hh" hint-placeholder-count="2">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;"><div><div style="font-size:13.5px;font-weight:700;">{{ hh.name }}</div><div style="font-size:12px;font-weight:600;color:var(--ink2);">{{ hh.sub }}</div></div><button sc-camel-on-click="{{ hh.add }}" style="height:32px;padding:0 12px;border-radius:9px;background:var(--accent);color:#fff;font-weight:800;font-size:12px;">Add</button></div>
          </sc-for>
        </div>
      </sc-if>
    </sc-if>
  </div>
</sc-if>
