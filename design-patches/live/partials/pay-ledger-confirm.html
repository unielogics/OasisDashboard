<sc-if value="{{ e.awaiting }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;gap:6px;margin-top:8px;">
    <button sc-camel-on-click="{{ e.confirm }}" style="{{ e.confirmStyle }}">Confirm in Squarespace</button>
  </div>
  <div style="font-size:11px;font-weight:600;color:var(--ink3);margin-top:5px;">{{ e.confirmNote }}</div>
</sc-if>
<sc-if value="{{ e.sqMatch }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;gap:6px;margin-top:8px;">
    <button sc-camel-on-click="{{ e.sqMatchOpen }}" style="{{ e.sqMatchStyle }}">Match a Square payment</button>
  </div>
  <div style="font-size:11px;font-weight:600;color:var(--ink3);margin-top:5px;">{{ e.sqMatchNote }}</div>
</sc-if>
<sc-if value="{{ e.sqCanMove }}" hint-placeholder-val="{{ false }}">
  <button sc-camel-on-click="{{ e.sqMoveToggle }}" style="margin-top:6px;padding:0;background:none;border:none;font-size:11.5px;font-weight:700;color:var(--ink2);text-decoration:underline;">{{ e.sqMoveLabel }}</button>
  <sc-if value="{{ e.sqMoveOpen }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;gap:6px;margin-top:6px;">
      <input value="{{ e.sqMoveValue }}" sc-camel-on-input="{{ e.sqMoveInput }}" placeholder="Invoice number, like INV-20640" style="flex:1;min-width:0;height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:600;">
      <button sc-camel-on-click="{{ e.sqMoveSubmit }}" style="{{ e.sqMoveStyle }}">Move</button>
    </div>
    <sc-if value="{{ e.sqHasMoveError }}" hint-placeholder-val="{{ false }}"><div style="font-size:11.5px;font-weight:700;color:var(--red);margin-top:5px;">{{ e.sqMoveError }}</div></sc-if>
  </sc-if>
</sc-if>
<sc-if value="{{ e.sqHasReceipt }}" hint-placeholder-val="{{ false }}">
  <button sc-camel-on-click="{{ e.sqReceiptOpen }}" style="display:block;margin-top:6px;padding:0;background:none;border:none;font-size:11.5px;font-weight:700;color:var(--accentInk);text-decoration:underline;">{{ e.sqReceiptLabel }}</button>
</sc-if>
