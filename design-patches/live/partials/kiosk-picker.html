<sc-if value="{{ live.kiosk.picker.open }}" hint-placeholder-val="{{ false }}">
  <div sc-camel-on-click="{{ live.kiosk.picker.cancel }}" style="position:fixed;inset:0;z-index:80;background:rgba(8,12,10,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:36px;animation:oa-fade .18s ease;">
    <div data-kiosk-picker="1" role="dialog" aria-modal="true" aria-label="{{ live.kiosk.picker.title }}" sc-camel-on-click="{{ live.kiosk.picker.stop }}" style="width:100%;max-width:760px;max-height:100%;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadowLg);padding:26px 28px;animation:oa-rise .24s cubic-bezier(.2,.7,.3,1);">
      <div style="display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;">
        <div style="flex:1;min-width:0;">
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.02em;">{{= live.kiosk.picker.title }}</div>
          <div style="font-size:13px;color:var(--ink2);font-weight:600;margin-top:3px;">Tap your name</div>
        </div>
        <button sc-camel-on-click="{{ live.kiosk.picker.cancel }}" style="height:44px;padding:0 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--ink2);flex:none;">Cancel</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;">
        <sc-for list="{{ live.kiosk.picker.tiles }}" as="t" hint-placeholder-count="4">
          <button data-kiosk-tile="1" sc-camel-on-click="{{ t.onClick }}" style="display:flex;align-items:center;gap:12px;min-height:88px;padding:0 16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;text-align:left;color:var(--ink);">
            <span style="{{ t.avatarStyle }}">{{= t.initials }}</span>
            <span style="min-width:0;"><span style="display:block;font-weight:800;font-size:16px;">{{= t.name }}</span><span style="display:block;font-size:12.5px;color:var(--ink3);font-weight:600;margin-top:2px;">{{= t.title }}</span></span>
          </button>
        </sc-for>
      </div>
      <sc-if value="{{ live.kiosk.picker.empty }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:14px;font-weight:600;color:var(--ink2);line-height:1.5;">Nobody shows on the kiosk yet. A manager can add names in Settings → Kiosk.</div>
      </sc-if>
    </div>
  </div>
</sc-if>
