<sc-if value="{{ nf.hasQuote }}" hint-placeholder-val="{{ false }}">
  <div style="margin-top:10px;padding:12px 15px;background:var(--panel);border:1px solid var(--line);border-radius:12px;">
    <div style="font-size:11px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">{{ nf.quoteTitle }}</div>
    <sc-for list="{{ nf.quoteLines }}" as="ql" hint-placeholder-count="2">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0;"><span style="{{ ql.labelStyle }}">{{ ql.label }}</span><span style="{{ ql.valStyle }}">{{ ql.value }}</span></div>
    </sc-for>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:8px;margin-top:6px;border-top:1px solid var(--line);"><span style="font-size:13px;font-weight:800;">{{ nf.quoteTotalLabel }}</span><span style="font-size:15px;font-weight:800;">{{ nf.quoteTotal }}</span></div>
    <sc-if value="{{ nf.hasQuoteNote }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;font-weight:600;color:var(--ink2);margin-top:6px;line-height:1.4;">{{ nf.quoteNote }}</div></sc-if>
  </div>
</sc-if>
